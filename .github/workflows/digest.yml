name: digest

on:
  schedule:
    - cron: "0 13 * * *"  # 7:00 AM MDT / 6:00 AM MST
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # for the keepalive step below

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-collector.txt
      - run: pip install -r requirements-collector.txt
      - run: python -m jobpull.digest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}

      # GitHub disables scheduled workflows after 60 days without repo activity.
      # Re-enabling them daily keeps the tracker running even if you never push again.
      - name: Keep scheduled workflows enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/collect.yml/enable" || true
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/digest.yml/enable" || true
